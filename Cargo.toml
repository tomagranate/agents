[package]
name = "agents"
version = "0.6.0"
edition = "2024"
description = "Manage shared AI agent configuration and archive chat history"
license = "MIT"
repository = "https://github.com/tomagranate/agents"

[[bin]]
name = "agents"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
fs2 = "0.4"
hex = "0.4"
hostname = "0.4"
json5 = "0.4"
percent-encoding = "2.3"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
