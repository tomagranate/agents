# Portable MCP servers. `agents sync` installs npm packages, then upserts these
# into each harness. Auth stays local. Do not put tokens, env values, or
# absolute paths here.

[[servers]]
id = "cloudflare-api"
url = "https://mcp.cloudflare.com/mcp"

[[servers]]
id = "agentprism-workflow"
command = "agentprism-workflow"
npm = "@automatalabs/mcp-server"

[[servers]]
id = "1password"
command = "1password-mcp"
